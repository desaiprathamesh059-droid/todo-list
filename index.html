<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
        <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="nav-brand">TodoFlow</div>
      <nav class="nav-links" aria-label="Main navigation">
        <a href="#">Home</a>
        <a href="#">Tasks</a>
        <a href="#">Completed</a>
      </nav>
    </header>

    <main class="app">
      <section class="todo-panel">
        <h1>Todo List</h1>

        <form id="todo-form" class="todo-form">
          <label class="sr-only" for="todo-input">Add a task</label>
          <input id="todo-input" type="text" placeholder="Add a new task..." autocomplete="off" maxlength="200" />
          <button type="submit" class="primary-btn">Add</button>
        </form>

        <div class="toolbar">
          <div id="task-count" class="task-count">0 tasks</div>
          <div class="filters" aria-label="Filter tasks">
            <button class="filter-btn active" data-filter="all" type="button">All</button>
            <button class="filter-btn" data-filter="active" type="button">Active</button>
            <button class="filter-btn" data-filter="completed" type="button">Completed</button>
          </div>
        </div>

        <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

        <button id="clear-completed" class="secondary-btn" type="button">Clear completed</button>
      </section>
    </main>

    <script>
      const todoForm = document.getElementById('todo-form');
      const todoInput = document.getElementById('todo-input');
      const todoList = document.getElementById('todo-list');
      const taskCount = document.getElementById('task-count');
      const clearCompletedButton = document.getElementById('clear-completed');
      const filterButtons = document.querySelectorAll('.filter-btn');

      const STORAGE_KEY = 'todo-list-items';
      let currentFilter = 'all';

      function loadTasks() {
        try {
          const savedTasks = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
          return Array.isArray(savedTasks) ? savedTasks : [];
        } catch (error) {
          return [];
        }
      }

      let tasks = loadTasks();

      function saveTasks() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }

      function updateTaskCount() {
        const activeTasks = tasks.filter((task) => !task.completed).length;
        const label = activeTasks === 1 ? '1 task left' : `${activeTasks} tasks left`;
        taskCount.textContent = label;
      }

      function getVisibleTasks() {
        if (currentFilter === 'active') return tasks.filter((task) => !task.completed);
        if (currentFilter === 'completed') return tasks.filter((task) => task.completed);
        return tasks;
      }

      function escapeHtml(value) {
        return value
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderTasks() {
        const visibleTasks = getVisibleTasks();

        if (visibleTasks.length === 0) {
          todoList.innerHTML = '<li class="empty-state">No tasks here yet.</li>';
          updateTaskCount();
          return;
        }

        todoList.innerHTML = visibleTasks
          .map(
            (task) => `
              <li class="todo-item ${task.completed ? 'completed' : ''}" data-id="${task.id}">
                <input class="checkbox" type="checkbox" ${task.completed ? 'checked' : ''} aria-label="Mark task as complete" />
                <span class="todo-text">${escapeHtml(task.text)}</span>
                <button class="delete-btn" type="button" aria-label="Delete task">Delete</button>
              </li>
            `
          )
          .join('');

        updateTaskCount();
      }

      function addTask(text) {
        const trimmedText = text.trim();
        if (!trimmedText) return;

        tasks.unshift({
          id: Date.now() + Math.random(),
          text: trimmedText,
          completed: false
        });

        saveTasks();
        renderTasks();
      }

      function toggleTask(taskId) {
        tasks = tasks.map((task) =>
          task.id === taskId ? { ...task, completed: !task.completed } : task
        );

        saveTasks();
        renderTasks();
      }

      function deleteTask(taskId) {
        tasks = tasks.filter((task) => task.id !== taskId);
        saveTasks();
        renderTasks();
      }

      function clearCompleted() {
        tasks = tasks.filter((task) => !task.completed);
        saveTasks();
        renderTasks();
      }

      todoForm.addEventListener('submit', (event) => {
        event.preventDefault();
        addTask(todoInput.value);
        todoInput.value = '';
        todoInput.focus();
      });

      todoList.addEventListener('click', (event) => {
        const deleteButton = event.target.closest('.delete-btn');
        const checkbox = event.target.closest('.checkbox');
        const item = event.target.closest('.todo-item');

        if (deleteButton && item) {
          deleteTask(Number(item.dataset.id));
          return;
        }

        if (checkbox && item) {
          toggleTask(Number(item.dataset.id));
        }
      });

      filterButtons.forEach((button) => {
        button.addEventListener('click', () => {
          currentFilter = button.dataset.filter;
          filterButtons.forEach((btn) => btn.classList.toggle('active', btn === button));
          renderTasks();
        });
      });

      clearCompletedButton.addEventListener('click', clearCompleted);
      renderTasks();
    </script>
  </body>
</html>
